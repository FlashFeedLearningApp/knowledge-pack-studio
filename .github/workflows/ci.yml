name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Format
        run: ruff format --check src tests
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest
      - name: Offline pipeline smoke test
        run: knowledge-pack-studio --smoke-run --run-root "${{ runner.temp }}/knowledge-pack-runs"
